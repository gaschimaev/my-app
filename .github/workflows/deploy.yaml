name: Deploy to AWS ECS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build & push Backend image
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
        run: |
          docker build -t $ECR_REGISTRY/my-app-backend:latest ./backend
          docker push $ECR_REGISTRY/my-app-backend:latest

      - name: Build & push Frontend image
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
        run: |
          docker build -t $ECR_REGISTRY/my-app-frontend:latest ./frontend
          docker push $ECR_REGISTRY/my-app-frontend:latest

      - name: Deploy to ECS
        run: |
          aws ecs update-service --cluster my-app-cluster \
            --service my-app-backend-service --force-new-deployment
          aws ecs update-service --cluster my-app-cluster \
            --service my-app-frontend-service --force-new-deployment
